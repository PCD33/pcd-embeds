<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#ECEEEA}
  .lucide{stroke-width:1.5!important}
  .cols-scroll{scrollbar-width:thin}
  .acf-switch,.notes-switch{width:42px;height:24px;border-radius:999px;border:none;cursor:pointer;position:relative;background:#CBD2C9;transition:background .2s;flex:0 0 auto}
  .acf-knob,.notes-knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
  .stage.show-acf .acf-switch{background:#2F663B}
  .stage.show-acf .acf-knob{transform:translateX(18px)}
  .stage.show-notes .notes-switch{background:#C77B26}
  .stage.show-notes .notes-knob{transform:translateX(18px)}
  .avis-switch{width:42px;height:24px;border-radius:999px;border:none;cursor:pointer;position:relative;background:#CBD2C9;transition:background .2s;flex:0 0 auto}
  .avis-knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
  .stage.show-empty .avis-switch{background:#5A6B52}
  .stage.show-empty .avis-knob{transform:translateX(18px)}
  .data-switch{width:42px;height:24px;border-radius:999px;border:none;cursor:pointer;position:relative;background:#CBD2C9;transition:background .2s;flex:0 0 auto}
  .data-knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
  .stage.show-sparse .data-switch{background:#9C8D56}
  .stage.show-sparse .data-knob{transform:translateX(18px)}
  .lock-chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:600;line-height:1.5}
  .ctrl-group{display:flex;align-items:center;gap:10px}
  .ctrl-div{width:1px;height:30px;background:#E2E8E0;flex:0 0 auto}
  .seg{display:inline-flex;background:#EDEFEA;border:1px solid #E2E8E0;border-radius:999px;padding:3px}
  .seg-btn{border:none;background:transparent;border-radius:999px;padding:6px 14px;font:700 12.5px 'Satoshi';color:#5A6B52;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .18s,color .18s}
  .seg-btn.on{background:#2F663B;color:#fff;box-shadow:0 2px 6px rgba(31,81,48,.24)}
  .seg-btn.on-atelier{background:#8A5A12}
</style>
</helmet>
<div class="{{ stageClass }}" style="min-height:100vh;background:#ECEEEA;font-family:'Satoshi',system-ui,sans-serif">

  <!-- CONTROL BAR -->
  <div style="position:fixed;top:0;left:0;right:0;z-index:200;background:#F8F9FA;border-bottom:1px solid #E2E8E0;padding:11px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:9px;margin-right:auto">
      <i data-lucide="sprout" style="width:19px;height:19px;color:#2F663B"></i>
      <span style="font-size:14px;font-weight:700;color:#1A3A0F">Fiche variété — Cœur de Bœuf</span>
      <span style="font-size:12px;color:#9aa39a">Sous-fiche de la Tomate · prototype pilotable</span>
    </div>

    <div class="ctrl-group">
      <span style="font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#8A9A82">Accès</span>
      <div class="seg">
        <button class="{{ segPublicClass }}" onClick="{{ setRole }}" data-role="public"><i data-lucide="globe" style="width:14px;height:14px"></i>Public</button>
        <button class="{{ segGratuitClass }}" onClick="{{ setRole }}" data-role="gratuit"><i data-lucide="user-round" style="width:14px;height:14px"></i>Gratuit</button>
        <button class="{{ segAtelierClass }}" onClick="{{ setRole }}" data-role="atelier"><i data-lucide="gem" style="width:14px;height:14px"></i>Atelier</button>
      </div>
    </div>

    <div class="ctrl-div"></div>

    <div class="ctrl-group">
      <span style="font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#8A9A82">Format</span>
      <div class="seg">
        <button class="{{ segMobileClass }}" onClick="{{ setFormat }}" data-format="mobile"><i data-lucide="smartphone" style="width:14px;height:14px"></i>Mobile</button>
        <button class="{{ segDesktopClass }}" onClick="{{ setFormat }}" data-format="desktop"><i data-lucide="monitor" style="width:14px;height:14px"></i>Desktop</button>
      </div>
    </div>

    <div class="ctrl-div"></div>

    <div class="ctrl-group">
      <button onClick="{{ toggleAcf }}" aria-label="Afficher les champs ACF" class="acf-switch"><span class="acf-knob"></span></button>
      <span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#3A4A33"><i data-lucide="tag" style="width:16px;height:16px;color:#3A4A33"></i>Champs ACF</span>
    </div>
    <div class="ctrl-group">
      <button onClick="{{ toggleNotes }}" aria-label="Afficher les annotations" class="notes-switch"><span class="notes-knob"></span></button>
      <span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#3A4A33"><i data-lucide="message-square-text" style="width:16px;height:16px;color:#3A4A33"></i>Annotations</span>
    </div>
    <div class="ctrl-group">
      <button onClick="{{ toggleEmpty }}" aria-label="Basculer l'état des avis" class="avis-switch"><span class="avis-knob"></span></button>
      <span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#3A4A33"><i data-lucide="star" style="width:16px;height:16px;color:#3A4A33"></i>{{ avisLabel }}</span>
    </div>
    <div class="ctrl-group">
      <button onClick="{{ toggleSparse }}" aria-label="Basculer la complétude des données" class="data-switch"><span class="data-knob"></span></button>
      <span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#3A4A33"><i data-lucide="database" style="width:16px;height:16px;color:#3A4A33"></i>{{ dataLabel }}</span>
    </div>
  </div>

  <!-- STAGE : mobile OU desktop, piloté par les mêmes contrôles -->
  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ true }}">
  <div class="cols-scroll" style="overflow-x:auto;padding:92px 0 56px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px;width:390px;margin:0 auto;padding:0 32px">
      <header style="background:#fff;border:1px solid #E2E8E0;border-radius:14px;padding:15px 16px;width:100%">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px">
          <span style="display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:{{ tierBadgeBg }};color:{{ tierBadgeFg }}"><i data-lucide="{{ tierIcon }}" style="width:13px;height:13px"></i>{{ tierName }}</span>
          <span style="font-size:11.5px;font-weight:600;color:#9aa39a">{{ tierMeta }}</span>
        </div>
        <div style="font-weight:700;font-size:16px;color:#1A3A0F;margin-bottom:5px">{{ tierTitle }}</div>
        <p style="margin:0;font-size:12.5px;line-height:1.5;color:#6B7768">{{ tierDesc }}</p>
      </header>
      <dc-import name="fiche-variete-colonne" role="{{ role }}" acf="{{ acf }}" notes="{{ notes }}" empty-avis="{{ emptyAvis }}" sparse="{{ sparse }}" hint-size="390px,810px"></dc-import>
    </div>
  </div>
  </sc-if>

  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ false }}">
  <div class="cols-scroll" style="overflow-x:auto;padding:92px 0 56px">
    <div style="display:flex;flex-direction:column;align-items:stretch;gap:16px;width:1160px;max-width:calc(100vw - 48px);margin:0 auto;padding:0 24px">
      <header style="background:#fff;border:1px solid #E2E8E0;border-radius:14px;padding:14px 18px;width:100%;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <span style="display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:{{ tierBadgeBg }};color:{{ tierBadgeFg }}"><i data-lucide="{{ tierIcon }}" style="width:13px;height:13px"></i>{{ tierName }}</span>
        <div style="font-weight:700;font-size:14.5px;color:#1A3A0F">{{ tierTitle }}</div>
        <p style="margin:0;font-size:12.5px;line-height:1.45;color:#6B7768;flex:1;min-width:220px">{{ tierDesc }}</p>
        <span style="font-size:11.5px;font-weight:600;color:#9aa39a">{{ tierMeta }}</span>
      </header>
      <dc-import name="fiche-variete-desktop" role="{{ role }}" acf="{{ acf }}" notes="{{ notes }}" empty-avis="{{ emptyAvis }}" sparse="{{ sparse }}" hint-size="1112px,900px"></dc-import>
    </div>
  </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { role: 'public', acf: false, notes: false, emptyAvis: false, sparse: false, format: 'mobile' };

  componentDidMount() { this._mounted = true; this.renderIcons(); }
  componentDidUpdate() { this.renderIcons(); }
  componentWillUnmount() { this._mounted = false; }

  renderIcons() {
    const tick = () => {
      if (!this._mounted) return;
      if (window.lucide && window.lucide.createIcons) { try { window.lucide.createIcons(); } catch (e) {} }
      else setTimeout(tick, 150);
    };
    tick();
  }

  setRole(e) { this.setState({ role: e.currentTarget.getAttribute('data-role') }); }
  setFormat(e) { this.setState({ format: e.currentTarget.getAttribute('data-format') }); }
  toggleAcf() { this.setState(s => ({ acf: !s.acf })); }
  toggleNotes() { this.setState(s => ({ notes: !s.notes })); }
  toggleEmpty() { this.setState(s => ({ emptyAvis: !s.emptyAvis })); }
  toggleSparse() { this.setState(s => ({ sparse: !s.sparse })); }

  renderVals() {
    const role = this.state.role;
    const tiers = {
      public: { icon: 'globe', name: 'Public', bg: '#EDEFEA', fg: '#5A6B52', meta: 'SEO & acquisition', title: 'Visiteur non connecté', desc: 'Hero, 3 stats et description courte visibles. Description longue, calendrier, maladies, avis et pépinières verrouillés.' },
      gratuit: { icon: 'user-round', name: 'Membre gratuit', bg: '#E4F4E6', fg: '#2F663B', meta: 'Engagement', title: 'Compte FluentCommunity', desc: 'Fiche variété complète et communauté ouvertes. Seules les pépinières restent réservées à l’Atelier.' },
      atelier: { icon: 'gem', name: 'Membre Atelier', bg: '#FFF3CE', fg: '#8A5A12', meta: '89 €/an', title: 'Abonné payant', desc: 'Tout est débloqué : pépinières spécifiques à la variété, assistant ATG flottant, message de fidélité au lieu du CTA d’adhésion.' },
    };
    const t = tiers[role] || tiers.public;
    const seg = (r, cls) => 'seg-btn' + (role === r ? (' on' + (cls || '')) : '');
    const fmt = this.state.format;
    const segFmt = (f) => 'seg-btn' + (fmt === f ? ' on' : '');

    return {
      stageClass: 'stage' + (this.state.acf ? ' show-acf' : '') + (this.state.notes ? ' show-notes' : '') + (this.state.emptyAvis ? ' show-empty' : '') + (this.state.sparse ? ' show-sparse' : ''),
      role: role,
      acf: this.state.acf,
      notes: this.state.notes,
      emptyAvis: this.state.emptyAvis,
      sparse: this.state.sparse,
      avisLabel: this.state.emptyAvis ? 'Avis : 0 avis' : 'Avis : avec avis',
      dataLabel: this.state.sparse ? 'Données : minimales' : 'Données : complètes',
      setRole: this.setRole.bind(this),
      setFormat: this.setFormat.bind(this),
      isMobile: fmt === 'mobile',
      isDesktop: fmt === 'desktop',
      segMobileClass: segFmt('mobile'),
      segDesktopClass: segFmt('desktop'),
      toggleAcf: this.toggleAcf.bind(this),
      toggleNotes: this.toggleNotes.bind(this),
      toggleEmpty: this.toggleEmpty.bind(this),
      toggleSparse: this.toggleSparse.bind(this),
      segPublicClass: seg('public'),
      segGratuitClass: seg('gratuit'),
      segAtelierClass: seg('atelier', '-atelier'),
      tierIcon: t.icon, tierName: t.name, tierBadgeBg: t.bg, tierBadgeFg: t.fg,
      tierMeta: t.meta, tierTitle: t.title, tierDesc: t.desc,
    };
  }
}

</script>
</body>
</html>
